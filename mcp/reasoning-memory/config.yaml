version: 1
episodes_dir: episodes
index_dir: index
patterns_dir: patterns
vector_dir: vector
embedding:
  provider: ollama
  model: nomic-embed-text
  base_url: http://localhost:11434
  enabled: false
retrieval:
  top_k_default: 3
  min_similarity: 0.15
  hybrid_weight: 0.5
consolidation:
  prune_after_days: 90
  min_episodes_for_pattern: 3
  auto_run: true
security:
  redact_secrets: true
  redact_before_embedding: true
  redact_on_retrieval: true
  redact_polished_prompts: true
  replacement: "[REDACTED]"
  audit_detection: true
prompt_polishing:
  enabled: true
  default_target_agent: generic
  default_output_format: markdown
  include_memory_by_default: true
  max_memories: 3
  max_prompt_chars: 20000
  include_failure_lessons: true
  include_full_traces: false
  deduplicate_context: true
link_ingestion:
  enabled: true
  max_links: 5
  request_timeout_seconds: 10
  max_redirects: 3
  max_response_bytes: 2097152
  max_extracted_chars: 50000
  max_summary_chars: 4000
  max_concurrency: 3
  cache_ttl_minutes: 15
  allowed_content_types:
    - text/html
    - text/plain
  failure_policy: warn
  include_thinking_trace: false
  rest_require_pre_summarized: true
